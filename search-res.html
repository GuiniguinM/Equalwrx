<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Search Results</title>
</head>
<body>
    <div class="container">
        <h1>Search Results</h1>

        <!-- Live search form with filters -->
        <form id="search-form" action="search_results.html" method="GET">
            <div class="search-container">
                <div class="search-input">
                    <label for="search">Search:</label>
                    <input type="text" id="search" name="query" placeholder="Enter job title..." oninput="displaySearchResults()">
                </div>
                
                <div class="filter-container">
                    <label for="employment-type">Employment Type:</label>
                    <select id="employment-type" onchange="displaySearchResults()">
                        <option value="all">All Types</option>
                        <option value="Full-Time">Full Time</option>
                        <option value="Part-Time">Part Time</option>
                        <option value="Contractual">Contractual</option>
                    </select>
                </div>
            </div>
        </form>

        <div id="search-results">
            <!-- Dynamic search results will appear here -->
        </div>

        <button type="button" class="back-btn">
            <a href="joblist.html" class="google-login-btn">
                <i class="fas fa-arrow-left"></i> Back to Joblist
            </a>
        </button>
    </div>

    <script>
        // Updated job listings with actual data from the project
        const jobListings = [
            { 
                title: "Hair Stylist",
                type: "Full-Time",
                link: "job-description/hair-stylist.html"
            },
            { 
                title: "Head Chef",
                type: "Full-Time",
                link: "job-description/head-chef.html"
            },
            { 
                title: "Kitchen Porter",
                type: "Full-Time",
                link: "job-description/kitchen-porter.html"
            },
            { 
                title: "Line Cook",
                type: "Part-Time",
                link: "job-description/line-cook.html"
            },
            { 
                title: "Massage Therapist",
                type: "Full-Time",
                link: "job-description/massage-therapist.html"
            },
            { 
                title: "Math Teacher",
                type: "Full-Time",
                link: "job-description/math-teacher.html"
            },
            { 
                title: "Nail Technician",
                type: "Part-Time",
                link: "job-description/nail-technician.html"
            },
            { 
                title: "Science Teacher",
                type: "Part-Time",
                link: "job-description/science-teacher.html"
            },
            { 
                title: "Teaching Assistant",
                type: "Full-Time",
                link: "job-description/teaching-assistant.html"
            }
        ];

        // Function to display search results
        function displaySearchResults() {
            const query = document.getElementById('search').value.toLowerCase();
            const employmentType = document.getElementById('employment-type').value;
            const resultsContainer = document.getElementById('search-results');

            // Filter results based on search query and employment type
            const filteredResults = jobListings.filter(job => {
                const matchesQuery = job.title.toLowerCase().includes(query);
                const matchesType = employmentType === 'all' || job.type === employmentType;
                return matchesQuery && matchesType;
            });

            // Clear previous results
            resultsContainer.innerHTML = '';

            if (filteredResults.length > 0) {
                filteredResults.forEach(job => {
                    const jobButton = document.createElement('button');
                    jobButton.type = "button";
                    jobButton.classList.add('category-btn');
                    jobButton.innerHTML = `
                        <a href="${job.link}" class="google-login-btn">
                            ${job.title} - ${job.type}
                        </a>`;
                    resultsContainer.appendChild(jobButton);
                });
            } else {
                resultsContainer.innerHTML = '<p>No results found</p>';
            }
        }
    </script>

    <style>
        .search-container {
            margin-bottom: 20px;
        }

        .search-input, .filter-container {
            margin-bottom: 10px;
        }

        .filter-container select {
            padding: 8px;
            margin-left: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</body>
</html>
