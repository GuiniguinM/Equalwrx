<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Employer Settings</title>
</head>
<body>
    <div class="container">
        <h1>Settings</h1>
        
        <div class="settings-menu">
            <button type="button" class="settings-option" onclick="window.location.href='employer-info.html'">
                <i class="fas fa-building"></i>
                <span>Company Information</span>
                <i class="fas fa-chevron-right"></i>
            </button>

            <button type="button" class="settings-option">
                <i class="fas fa-bell"></i>
                <span>Notifications</span>
                <i class="fas fa-chevron-right"></i>
            </button>

            <button type="button" class="settings-option">
                <i class="fas fa-lock"></i>
                <span>Privacy & Security</span>
                <i class="fas fa-chevron-right"></i>
            </button>

            <button type="button" class="settings-option">
                <i class="fas fa-palette"></i>
                <span>Appearance</span>
                <i class="fas fa-chevron-right"></i>
            </button>

            <button type="button" class="settings-option">
                <i class="fas fa-question-circle"></i>
                <span>Help & Support</span>
                <i class="fas fa-chevron-right"></i>
            </button>

            <button type="button" class="settings-option">
                <i class="fas fa-info-circle"></i>
                <span>About</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <button type="button" class="back-btn">
            <a href="employer-portal.html" class="google-login-btn">
                <i class="fas fa-arrow-left"></i> Back to Portal
            </a>
        </button>
    </div>

    <style>
        .settings-menu {
            max-width: 600px;
            margin: 20px auto;
        }

        .settings-option {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .settings-option:hover {
            background: #e0e0e0;
        }

        .settings-option i:first-child {
            margin-right: 15px;
            font-size: 1.2em;
            width: 24px;
            text-align: center;
        }

        .settings-option span {
            flex-grow: 1;
            text-align: left;
            font-size: 1.1em;
        }

        .settings-option i:last-child {
            color: #666;
        }

        .back-btn {
            margin-top: 20px;
        }
    </style>
</body>
</html>
